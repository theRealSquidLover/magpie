function cphDraw(){var w=$("cphw");if(!w)return;var pid=curP(),p=pid&&P(pid),col=$("col")?$("col").value.trim():"";if(!p||!p.cp||!col){w.innerHTML="";return}
 var pend=CPHP&&CPHP.n.toLowerCase()==p.name.toLowerCase()&&CPHP.c.toLowerCase()==col.toLowerCase(),u=pend?CPHP.d:cphU(pid,col);
 w.innerHTML='<label>Photo of '+esc(col)+'</label><div style="display:flex;gap:10px;align-items:center">'+(u?'<img class="th" src="'+esc(u)+'">':"")+'<button class="sm" type="button" onclick="cphNew()">'+(u?"Change photo":"📷 Add a photo of this colour")+"</button>"+(pend?'<span class="m" style="display:inline">saved with this receive</span>':"")+"</div>"}
function cphNew(){var pid=curP(),col=$("col").value.trim();if(!pid||!col)return;photoFile(function(d){CPHP={n:P(pid).name,c:col,d:d};cphDraw()})}
function gPh(i){photoFile(function(d){G.rows[i].ph=d;gridDraw()})}

/* ---------- pending items: set up now, receive later ---------- */
var PREP=false;
function prepUpd(){document.querySelectorAll(".rcvonly").forEach(function(e){e.style.display=PREP?"none":""});rbUpd()}
function prepSave(more){var nm=$("nm").value.trim();if(!nm)return fail("Please double-check: item name missing. Nothing was saved.",["nm"]);
 if(!$("col").value.trim()&&!$("sz").value.trim()&&byName(nm))return fail("Nothing new to set up: add a colour and/or size.",["col"]);
 var pr=PSEL&&P(PSEL)?P(PSEL):byName(nm),name=pr?pr.name:nm,col=$("col").value.trim(),sz=$("sz").value.trim();
 if(limBad({product:nm,alias:$("al").value.trim(),colour:col,size:sz,pack:$("ppc").value.trim()}))return;
 queue({kind:"prepare",product:name,alias:$("al").value.trim(),pack:$("ppc").value.trim(),colour:col,size:sz});
 if(CPHP&&col&&CPHP.c.toLowerCase()==col.toLowerCase()&&CPHP.n.toLowerCase()==name.toLowerCase())queue({kind:"photo",product:name,colour:col,data:CPHP.d});CPHP=null;
 if(PH){queue({kind:"photo",product:name,data:PH});PH=null}
 var what=name+(col?" · "+col:"")+(sz?" · "+sz:"");
 if(more){$("col").value="";$("sz").value="";okMsg("Set up "+what+". Next colour/size:");chips();$("col").focus();return}
 PSEL=null;done("Set up "+what+(pr&&!pr.pend?".":" as a pending item. It shows under Pending on Stock until you receive it."))}
function gExists(c){return!!(G.pid&&findV(G.pid,G.by=="size"?G.col:c,G.by=="size"?c:G.sz))}
function gridPrep(){var g=G,gn=gNew();if(gn)g.rows.push({c:gn,q:""});var nw=g.rows.filter(function(r){return!gExists(r.c)});if(!nw.length)return;
 nw.forEach(function(r){queue({kind:"prepare",product:g.name,alias:g.alias,pack:g.pack,colour:g.by=="size"?g.col:r.c,size:g.by=="size"?r.c:g.sz})});
 if(g.by!="size")g.rows.forEach(function(r){if(r.ph)queue({kind:"photo",product:g.name,colour:r.c,data:r.ph})});
 gridClose();PSEL=null;RM="";done("Set up "+nw.length+" "+(g.by=="size"?"size":"colour")+(nw.length>1?"s":"")+" of "+g.name+". Nothing received yet.")}
function pendAct(id){var p=P(id);if(!p||id<0)return fail("This item hasn’t synced yet.");call(function(){return post("/api/product/"+id,{name:p.name,pending:false})},p.name+" is active. It shows with 0 until you receive stock.")}
function hasMv(id){return S.mv.some(function(m){var v=V(m.v);return v&&v.prod==id})}
function pendBack(id){var p=P(id);if(!p||id<0)return fail("This item hasn’t synced yet.");if(hasMv(id))return fail(p.name+" already has stock history, so it can’t go back to pending.");call(function(){return post("/api/product/"+id,{name:p.name,pending:true})},p.name+" is back under Pending. Receive it when the stock arrives.")}
function pendRcv(id){PREP=false;go("Receive");pickP(id)}
</script></body></html>
